name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Vite 8 i @vitejs/plugin-react 6 wymagają ^20.19.0 || >=22.12.0.
          # Node 20 jest po EOL (kwiecień 2026), więc budujemy na 22 LTS.
          node-version: 22

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Node modules
        working-directory: ./budzet-domowy
        run: npm install

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './budzet-domowy/src-tauri -> target'

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './budzet-domowy'
          tagName: ${{ github.ref_name }}
          releaseName: 'Domowy Budżet ${{ github.ref_name }}'
          releaseBody: 'Najnowsze wydanie aplikacji Domowy Budżet. Pobierz odpowiedni plik instalacyjny dla swojego systemu operacyjnego.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
